<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/miles-caf-design-system-f38ef900-a0c6-4f0c-9f9e-ae35f79c76e2/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/miles-caf-design-system-f38ef900-a0c6-4f0c-9f9e-ae35f79c76e2/tokens/colors.css">
  <link rel="stylesheet" href="_ds/miles-caf-design-system-f38ef900-a0c6-4f0c-9f9e-ae35f79c76e2/tokens/typography.css">
  <link rel="stylesheet" href="_ds/miles-caf-design-system-f38ef900-a0c6-4f0c-9f9e-ae35f79c76e2/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/miles-caf-design-system-f38ef900-a0c6-4f0c-9f9e-ae35f79c76e2/tokens/radius.css">
  <link rel="stylesheet" href="_ds/miles-caf-design-system-f38ef900-a0c6-4f0c-9f9e-ae35f79c76e2/tokens/elevation.css">
  <link rel="stylesheet" href="_ds/miles-caf-design-system-f38ef900-a0c6-4f0c-9f9e-ae35f79c76e2/tokens/base.css">
  <link rel="stylesheet" href="_ds/miles-caf-design-system-f38ef900-a0c6-4f0c-9f9e-ae35f79c76e2/styles.css">
  <script src="_ds/miles-caf-design-system-f38ef900-a0c6-4f0c-9f9e-ae35f79c76e2/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: var(--surface-canvas); }
    * { box-sizing: border-box; }
  </style>
</helmet>
<x-import component-from-global-scope="MilesCafDesignSystem_f38ef9.TopNav" logo-src="assets/logo-wordmark.png" links="{{ links }}" active-link="{{ active }}" cta="Get a quote" secondary="" on-navigate="{{ navigate }}" hint-size="100%,64px"></x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Catering&quot;,&quot;Menu&quot;,&quot;About&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    if (/\.dc\.html$/i.test(window.location.pathname)) return;
    const map = { "Home.dc.html": "index.html", "Catering.dc.html": "catering.html", "Menu.dc.html": "menu.html", "About.dc.html": "about.html" };
    const patch = () => {
      document.querySelectorAll('a[href*=".dc.html"]').forEach((a) => {
        const [file, hash] = (a.getAttribute("href") || "").split("#");
        if (map[file]) a.setAttribute("href", map[file] + (hash ? "#" + hash : ""));
      });
    };
    patch();
    const obs = new MutationObserver(patch);
    obs.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["href"] });
    window.addEventListener("load", patch);
    setTimeout(() => { patch(); obs.disconnect(); }, 6000);
  }
  renderVals() {
    const dev = /\.dc\.html$/i.test(window.location.pathname);
    const map = dev
      ? { Home: "Home.dc.html", Catering: "Catering.dc.html", Menu: "Menu.dc.html", About: "About.dc.html" }
      : { Home: "index.html", Catering: "catering.html", Menu: "menu.html", About: "about.html" };
    const quoteHref = dev ? "Catering.dc.html#quote" : "catering.html#quote";
    return {
      links: ["Home", "Catering", "Menu", "About"],
      active: this.props.active ?? "Home",
      navigate: (label) => {
        if (label === "Get a quote") { window.location.href = quoteHref; return; }
        if (map[label]) window.location.href = map[label];
      },
    };
  }
}
</script>
</body>
</html>
